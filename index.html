<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Default link-preview tags (data-seo). Crawlers get page-specific ones from middleware.ts; the app swaps them in the browser. -->
    <meta data-seo name="description" content="Gentle, honest dental care. Explore treatments, meet our dentists and book an appointment online." />
    <meta data-seo property="og:type" content="website" />
    <meta data-seo property="og:site_name" content="Forever Dental Care" />
    <meta data-seo property="og:title" content="Forever Dental Care" />
    <meta data-seo property="og:description" content="Gentle, honest dental care. Explore treatments, meet our dentists and book an appointment online." />
    <meta data-seo property="og:image" content="/og-image.png" />
    <meta data-seo property="og:image:width" content="1200" />
    <meta data-seo property="og:image:height" content="630" />
    <meta data-seo property="og:image:alt" content="Forever Dental Care" />
    <meta data-seo name="twitter:card" content="summary_large_image" />
    <meta data-seo name="twitter:title" content="Forever Dental Care" />
    <meta data-seo name="twitter:description" content="Gentle, honest dental care. Explore treatments, meet our dentists and book an appointment online." />
    <meta data-seo name="twitter:image" content="/og-image.png" />
    <link rel="apple-touch-icon" href="/og-image.png" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Forever Dental Care</title>
    <!-- Apply the saved/system theme before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
